name: Bootstrap_App_VPS

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Choose the inventory and deployment environment to target"
        required: true
        type: choice
        default: development
        options:
          - development
          - staging
          - production
      execution_mode:
        description: "Run local validation, remote check mode, or apply changes"
        required: true
        type: choice
        default: syntax
        options:
          - syntax
          - check
          - apply

permissions:
  contents: read

jobs:
  preflight:
    name: Validate Ansible files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          python -m pip install ansible-core==2.18.6
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Validate inventory and playbook
        shell: bash
        env:
          EXECUTION_MODE: ${{ inputs.execution_mode }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        working-directory: ${{ github.workspace }}/ansible
        run: |
          set -euo pipefail
          inventory="inventory/${TARGET_ENVIRONMENT}/hosts.yml"
          if [[ ! -s "$inventory" ]]; then
            echo "::error::Inventory $inventory is missing or empty. Add hosts before selecting this environment."
            exit 1
          fi

          ansible-inventory \
            -i "$inventory" \
            --graph

          playbook=playbooks/bootstrap-vps/bootstrap-app-vps.yml
          if [[ ! -s "$playbook" ]]; then
            if [[ "$EXECUTION_MODE" == "syntax" ]]; then
              echo "::warning::The app bootstrap playbook is empty; playbook syntax validation is deferred."
              exit 0
            fi
            echo "::error::Populate $playbook before selecting check or apply mode."
            exit 1
          fi

          ansible-playbook \
            -i "$inventory" \
            "$playbook" \
            --syntax-check

  bootstrap:
    name: Bootstrap ${{ inputs.target_environment }} app servers
    needs: preflight
    if: ${{ inputs.execution_mode != 'syntax' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible and sshpass
        run: |
          python -m pip install ansible-core==2.18.6
          ansible-galaxy collection install -r ansible/requirements.yml
          sudo apt-get update
          sudo apt-get install --yes sshpass

      - name: Configure SSH
        shell: bash
        env:
          VPS_USERNAME: ${{ vars[inputs.target_environment == 'development' && 'DEV_VPS_USERNAME' || inputs.target_environment == 'staging' && 'STG_VPS_USERNAME' || 'PROD_VPS_USERNAME'] }}
          VPS_PASSWORD: ${{ secrets[inputs.target_environment == 'development' && 'DEV_VPS_PASSWORD' || inputs.target_environment == 'staging' && 'STG_VPS_PASSWORD' || 'PROD_VPS_PASSWORD'] }}
          VPS_KNOWN_HOSTS: ${{ vars[inputs.target_environment == 'development' && 'DEV_VPS_KNOWN_HOSTS' || inputs.target_environment == 'staging' && 'STG_VPS_KNOWN_HOSTS' || 'PROD_VPS_KNOWN_HOSTS'] }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          set -euo pipefail
          if [[ -z "$VPS_USERNAME" ]]; then
            echo "::error::Set the VPS username variable for the $TARGET_ENVIRONMENT environment."
            exit 1
          fi
          if [[ -z "$VPS_PASSWORD" ]]; then
            echo "::error::Set the VPS password secret for the $TARGET_ENVIRONMENT environment."
            exit 1
          fi
          if [[ -z "$VPS_KNOWN_HOSTS" ]]; then
            echo "::error::Set the environment-specific VPS known hosts variable for $TARGET_ENVIRONMENT."
            exit 1
          fi

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Run Ansible
        shell: bash
        env:
          ANSIBLE_HOST_KEY_CHECKING: "True"
          EXECUTION_MODE: ${{ inputs.execution_mode }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          VPS_USERNAME: ${{ vars[inputs.target_environment == 'development' && 'DEV_VPS_USERNAME' || inputs.target_environment == 'staging' && 'STG_VPS_USERNAME' || 'PROD_VPS_USERNAME'] }}
          VPS_PASSWORD: ${{ secrets[inputs.target_environment == 'development' && 'DEV_VPS_PASSWORD' || inputs.target_environment == 'staging' && 'STG_VPS_PASSWORD' || 'PROD_VPS_PASSWORD'] }}
          VPS_SSH_PUBLIC_KEY: ${{ vars[inputs.target_environment == 'development' && 'DEV_SSH_PUBLIC_KEY' || inputs.target_environment == 'staging' && 'STG_SSH_PUBLIC_KEY' || 'PROD_SSH_PUBLIC_KEY'] }}
        working-directory: ${{ github.workspace }}/ansible
        run: |
          set -euo pipefail
          if [[ -z "$VPS_SSH_PUBLIC_KEY" ]]; then
            echo "::error::Set the SSH public key environment variable for the $TARGET_ENVIRONMENT environment."
            exit 1
          fi

          inventory="inventory/${TARGET_ENVIRONMENT}/hosts.yml"
          credentials_file="$(mktemp)"
          trap 'rm -f "$credentials_file"' EXIT
          python - "$credentials_file" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], "w", encoding="utf-8") as credentials:
              json.dump(
                  {
                      "ansible_user": os.environ["VPS_USERNAME"],
                      "ansible_password": os.environ["VPS_PASSWORD"],
                      "ssh_public_key": os.environ["VPS_SSH_PUBLIC_KEY"],
                  },
                  credentials,
              )
          PY

          args=(--extra-vars "@$credentials_file")
          args+=(--ssh-common-args "-o PubkeyAuthentication=no -o PreferredAuthentications=password")
          if [[ "$EXECUTION_MODE" == "check" ]]; then
            args+=(--check)
          fi

          ansible-playbook \
            -i "$inventory" \
            playbooks/bootstrap-vps/bootstrap-app-vps.yml \
            --limit app_servers \
            "${args[@]}"
