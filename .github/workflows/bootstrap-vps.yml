name: Bootstrap VPS

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: GitHub Environment to bootstrap
        required: true
        type: choice
        options:
          - Staging
          - Production
      target_host:
        description: Exact host alias from the selected Environment inventory
        required: true
        type: string

concurrency:
  group: bootstrap-${{ inputs.target_environment }}
  cancel-in-progress: false

permissions: {}

jobs:
  preflight:
    name: Secret-free preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      target_disposable: ${{ steps.validate-target.outputs.target_disposable }}
    env:
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible.cfg
      BOOTSTRAP_ENVIRONMENT: ${{ inputs.target_environment }}
      BOOTSTRAP_TARGET_HOST: ${{ inputs.target_host }}
      BOOTSTRAP_REF: ${{ github.ref }}
      BOOTSTRAP_ACTOR_ID: ${{ github.actor_id }}
    steps:
      - name: Check out the dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate Environment, ref, and dispatch App identity
        run: python3 deployment/tools/bootstrap_inventory.py --stage dispatch

      - name: Install pinned Ansible controller and collections
        run: |
          set -euo pipefail
          python3 -m venv .ansible-venv
          . .ansible-venv/bin/activate
          python -m pip install \
            --disable-pip-version-check \
            --no-input \
            -r requirements.txt
          ansible-galaxy collection install \
            --requirements-file requirements.yml \
            --collections-path ./.ansible/collections

      - name: Validate exact target, pin, source policy, and capacity
        id: validate-target
        run: |
          set -euo pipefail
          . .ansible-venv/bin/activate
          python3 deployment/tools/bootstrap_inventory.py --stage target

  bootstrap:
    name: Bootstrap selected host
    needs: preflight
    if: needs.preflight.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    environment:
      name: ${{ inputs.target_environment }}
    env:
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible.cfg
      ANSIBLE_INVENTORY_PATH: ${{ vars.ANSIBLE_INVENTORY_PATH }}
      BOOTSTRAP_ENVIRONMENT: ${{ inputs.target_environment }}
      BOOTSTRAP_TARGET_HOST: ${{ inputs.target_host }}
      BOOTSTRAP_REF: ${{ github.ref }}
      BOOTSTRAP_ACTOR_ID: ${{ github.actor_id }}
    steps:
      - name: Check out the dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pinned Ansible controller and collections
        run: |
          set -euo pipefail
          python3 -m venv .ansible-venv
          . .ansible-venv/bin/activate
          python -m pip install \
            --disable-pip-version-check \
            --no-input \
            -r requirements.txt
          ansible-galaxy collection install \
            --requirements-file requirements.yml \
            --collections-path ./.ansible/collections

      - name: Recheck the Environment inventory mapping before SSH
        run: |
          set -euo pipefail
          . .ansible-venv/bin/activate
          python3 deployment/tools/bootstrap_inventory.py \
            --stage all \
            --require-environment-inventory

      - name: Verify the admin private key matches the reviewed inventory key
        env:
          BOOTSTRAP_PHASE: validate-admin-key
          ANSIBLE_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          python3 deployment/tools/run_bootstrap_phase.py

      - name: Bootstrap accounts, updates, and firewall with initial access
        env:
          BOOTSTRAP_PHASE: initial-access
          VPS_INITIAL_ACCESS_PASSWORD: ${{ secrets.VPS_INITIAL_ACCESS_PASSWORD }}
        run: |
          set -euo pipefail
          python3 deployment/tools/run_bootstrap_phase.py

      - name: Prove fresh cdo-admin key access on port 22
        env:
          BOOTSTRAP_PHASE: admin-key-proof
          ANSIBLE_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          python3 deployment/tools/run_bootstrap_phase.py

      - name: Notify operator to remove the temporary password
        run: |
          notice='::notice title=Remove temporary access secret::'
          notice+='The independent cdo-admin key login succeeded. '
          notice+='Remove VPS_INITIAL_ACCESS_PASSWORD from the selected GitHub Environment.'
          printf '%s\n' "$notice"

      - name: Apply validated dual-listener SSH hardening on port 22
        env:
          BOOTSTRAP_PHASE: ssh-hardening
          ANSIBLE_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          python3 deployment/tools/run_bootstrap_phase.py

      - name: Verify a fresh admin-key login on port 4671
        env:
          BOOTSTRAP_PHASE: post-hardening-proof
          ANSIBLE_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          python3 deployment/tools/run_bootstrap_phase.py

      - name: Finalize SSH and UFW on port 4671 only
        env:
          BOOTSTRAP_PHASE: finalize-ssh-port
          ANSIBLE_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          python3 deployment/tools/run_bootstrap_phase.py

      - name: Verify a fresh admin-key login after closing port 22
        env:
          BOOTSTRAP_PHASE: post-port-finalization-proof
          ANSIBLE_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          python3 deployment/tools/run_bootstrap_phase.py

      - name: Close provider-firewall port 22
        run: |
          notice='::notice title=Close the old SSH port::'
          notice+='A fresh cdo-admin login on port 4671 succeeded after finalization. '
          notice+='Remove the provider-firewall TCP 22 rule, then verify 4671 remains reachable.'
          printf '%s\n' "$notice"

      - name: Enable Fail2ban on a managed service host after disposable proof
        if: needs.preflight.outputs.target_disposable != 'true'
        id: enable_fail2ban
        env:
          BOOTSTRAP_PHASE: fail2ban-enable
          ANSIBLE_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          python3 deployment/tools/run_bootstrap_phase.py

      - name: Verify fresh admin-key access after Fail2ban activation
        if: needs.preflight.outputs.target_disposable != 'true'
        env:
          BOOTSTRAP_PHASE: post-fail2ban-proof
          ANSIBLE_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          python3 deployment/tools/run_bootstrap_phase.py

      - name: Roll back failed Fail2ban activation
        if: failure() && needs.preflight.outputs.target_disposable != 'true' && steps.enable_fail2ban.outcome != 'skipped'
        env:
          BOOTSTRAP_PHASE: fail2ban-rollback
          ANSIBLE_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          python3 deployment/tools/run_bootstrap_phase.py

      - name: Prove fail2ban preserves disposable SSH access paths
        if: needs.preflight.outputs.target_disposable == 'true'
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/ansible.cfg
          ANSIBLE_INVENTORY_PATH: ${{ vars.ANSIBLE_INVENTORY_PATH }}
          ANSIBLE_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
          BOOTSTRAP_ENVIRONMENT: ${{ inputs.target_environment }}
          BOOTSTRAP_TARGET_HOST: ${{ inputs.target_host }}
          BOOTSTRAP_REF: ${{ github.ref }}
          BOOTSTRAP_ACTOR_ID: ${{ github.actor_id }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          python3 deployment/tools/run_fail2ban_proof.py
