name: Build-And-Test

on:
  workflow_call:
    inputs:
      image_name:
        description: GHCR image name to build and publish
        required: true
        type: string
      release_environment:
        description: Release channel selected by the caller; this does not select a VPS environment
        required: false
        type: string
      release_version:
        description: SemVer version selected by the caller's workflow dispatch
        required: false
        type: string

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      IMAGE_NAME: ${{ inputs.image_name }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run API tests
        run: npm run test:api

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the production image
        run: docker buildx build --platform linux/amd64 --load --tag "$IMAGE_NAME:$IMAGE_TAG" .

      - name: Run image and verify application health API
        run: |
          set -euo pipefail
          container_name="workflow-health-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm --force "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name "$container_name" \
            --publish 127.0.0.1:18080:3000 \
            "$IMAGE_NAME:$IMAGE_TAG" >/dev/null

          status_code="unavailable"
          for attempt in $(seq 1 60); do
            status_code="$(curl --silent --output /dev/null \
              --write-out '%{http_code}' --max-time 5 \
              http://127.0.0.1:18080/api/health 2>/dev/null || true)"
            if [[ "$status_code" == "200" ]]; then
              break
            fi
            sleep 2
          done

          if [[ "$status_code" != "200" ]]; then
            docker logs "$container_name"
            echo "::error::GET /api/health did not return HTTP 200; last status was $status_code."
            exit 1
          fi

          echo "Container started and GET /api/health returned HTTP 200."

      - name: Log in to private GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push health-verified image
        if: github.event_name != 'pull_request'
        run: docker push "$IMAGE_NAME:$IMAGE_TAG"

      - name: Publish GitHub release and generated notes
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        env:
          RELEASE_ENVIRONMENT: ${{ inputs.release_environment }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const releaseEnvironment = process.env.RELEASE_ENVIRONMENT;
            const releaseVersion = process.env.RELEASE_VERSION;
            const supportedEnvironments = ['development', 'staging', 'production'];
            if (!supportedEnvironments.includes(releaseEnvironment)) {
              throw new Error('release_environment must be development, staging, or production (release channel only).');
            }

            if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(releaseVersion || '')) {
              throw new Error('release_version must be a SemVer MAJOR.MINOR.PATCH value without a v prefix.');
            }

            const isProduction = releaseEnvironment === 'production';
            const prereleaseIdentifier = releaseEnvironment === 'development' ? 'alpha' : 'rc';
            const buildIdentifier = `${process.env.GITHUB_RUN_NUMBER}.${process.env.GITHUB_RUN_ATTEMPT}`;
            const releaseTag = isProduction
              ? `v${releaseVersion}`
              : `v${releaseVersion}-${prereleaseIdentifier}.${buildIdentifier}`;
            const environmentLabel = releaseEnvironment[0].toUpperCase() + releaseEnvironment.slice(1);
            const channelLabel = `${environmentLabel}${isProduction ? '' : ' (Non-production)'}`;
            const releaseTitle = `CustomerBuilderEngine ${releaseTag} - ${channelLabel}`;
            const { owner, repo } = context.repo;
            const sourceSha = process.env.GITHUB_SHA;
            const workflowRunUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const commitUrl = `${context.serverUrl}/${owner}/${repo}/commit/${sourceSha}`;

            let existingTag;
            try {
              existingTag = await github.rest.git.getRef({
                owner,
                repo,
                ref: `tags/${releaseTag}`,
              });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }
            if (existingTag) {
              throw new Error(`Release tag ${releaseTag} already exists at ${existingTag.data.object.sha}; choose a new release_version.`);
            }

            const generatedNotes = await github.rest.repos.generateReleaseNotes({
              owner,
              repo,
              tag_name: releaseTag,
              target_commitish: sourceSha,
            });
            const changeSummary = generatedNotes.data.body?.trim()
              || 'No additional changes were included in the GitHub-generated notes.';
            const body = [
              '## Build summary',
              `- **Release tag:** \`${releaseTag}\``,
              `- **Release channel:** ${channelLabel}`,
              `- **Source commit:** [\`${sourceSha.slice(0, 7)}\`](${commitUrl})`,
              `- **Workflow run:** [#${process.env.GITHUB_RUN_NUMBER}](${workflowRunUrl})`,
              `- **Health-verified image:** \`${process.env.IMAGE_NAME}:${process.env.IMAGE_TAG}\``,
              '- **Validation:** type-check, API tests, production image build, and `/api/health` verification passed.',
              '',
              '## Change summary',
              changeSummary,
            ].join('\n');

            const release = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: releaseTag,
              target_commitish: sourceSha,
              name: releaseTitle,
              body,
              draft: false,
              prerelease: !isProduction,
            });
            core.info(`Published ${releaseTag}: ${release.data.html_url}`);
