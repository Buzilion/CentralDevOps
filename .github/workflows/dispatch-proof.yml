name: Dispatch trust proof

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: CentralDevOps Environment to associate after authorization
        required: true
        type: string
      image_ref:
        description: Synthetic image reference bound by the OIDC audience
        required: true
        type: string
      oidc_token:
        description: Request-bound GitHub OIDC token
        required: true
        type: string
      sealed_bundle:
        description: Base64-encoded synthetic sealed bundle
        required: true
        type: string

permissions: {}

jobs:
  authorize:
    name: Authorize dispatch proof
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      environment: ${{ steps.verify.outputs.environment }}
      repository: ${{ steps.verify.outputs.repository }}
      job_workflow_ref: ${{ steps.verify.outputs.job_workflow_ref }}
      ref: ${{ steps.verify.outputs.ref }}
      run_id: ${{ steps.verify.outputs.run_id }}
      run_attempt: ${{ steps.verify.outputs.run_attempt }}
      audience_expected: ${{ steps.verify.outputs.audience_expected }}
      audience_observed: ${{ steps.verify.outputs.audience_observed }}
      check_central_ref: ${{ steps.verify.outputs.check_central_ref }}
      check_bundle_encoding: ${{ steps.verify.outputs.check_bundle_encoding }}
      check_oidc_signature: ${{ steps.verify.outputs.check_oidc_signature }}
      check_issuer: ${{ steps.verify.outputs.check_issuer }}
      check_expiry: ${{ steps.verify.outputs.check_expiry }}
      check_audience_binding: ${{ steps.verify.outputs.check_audience_binding }}
      check_required_claims: ${{ steps.verify.outputs.check_required_claims }}
      check_source_fixture: ${{ steps.verify.outputs.check_source_fixture }}
      check_source_claims: ${{ steps.verify.outputs.check_source_claims }}
      check_dispatch_actor: ${{ steps.verify.outputs.check_dispatch_actor }}
    steps:
      - name: Check out verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify dispatch proof
        id: verify
        env:
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          IMAGE_REF: ${{ inputs.image_ref }}
          OIDC_TOKEN: ${{ inputs.oidc_token }}
          SEALED_BUNDLE: ${{ inputs.sealed_bundle }}
          CENTRAL_REF: ${{ github.ref }}
          DISPATCH_ACTOR: ${{ github.actor }}
        run: node .github/scripts/verify-dispatch-proof.mjs

  environment-check:
    name: Confirm verified Environment association
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    environment:
      name: ${{ needs.authorize.outputs.environment }}
    steps:
      - name: Assert matching Environment and report sanitized evidence
        env:
          VERIFIED_ENVIRONMENT: ${{ needs.authorize.outputs.environment }}
          VERIFIED_REPOSITORY: ${{ needs.authorize.outputs.repository }}
          VERIFIED_JOB_WORKFLOW_REF: ${{ needs.authorize.outputs.job_workflow_ref }}
          VERIFIED_REF: ${{ needs.authorize.outputs.ref }}
          VERIFIED_RUN_ID: ${{ needs.authorize.outputs.run_id }}
          VERIFIED_RUN_ATTEMPT: ${{ needs.authorize.outputs.run_attempt }}
          VERIFIED_AUDIENCE_EXPECTED: ${{ needs.authorize.outputs.audience_expected }}
          VERIFIED_AUDIENCE_OBSERVED: ${{ needs.authorize.outputs.audience_observed }}
          CHECK_CENTRAL_REF: ${{ needs.authorize.outputs.check_central_ref }}
          CHECK_BUNDLE_ENCODING: ${{ needs.authorize.outputs.check_bundle_encoding }}
          CHECK_OIDC_SIGNATURE: ${{ needs.authorize.outputs.check_oidc_signature }}
          CHECK_ISSUER: ${{ needs.authorize.outputs.check_issuer }}
          CHECK_EXPIRY: ${{ needs.authorize.outputs.check_expiry }}
          CHECK_AUDIENCE_BINDING: ${{ needs.authorize.outputs.check_audience_binding }}
          CHECK_REQUIRED_CLAIMS: ${{ needs.authorize.outputs.check_required_claims }}
          CHECK_SOURCE_FIXTURE: ${{ needs.authorize.outputs.check_source_fixture }}
          CHECK_SOURCE_CLAIMS: ${{ needs.authorize.outputs.check_source_claims }}
          CHECK_DISPATCH_ACTOR: ${{ needs.authorize.outputs.check_dispatch_actor }}
        run: |
          set -euo pipefail

          if [[ "$VERIFIED_ENVIRONMENT" != "Staging" && "$VERIFIED_ENVIRONMENT" != "Production" ]]; then
            printf '%s\n' 'Environment association check failed: environment_output' >&2
            exit 1
          fi

          for check in \
            "$CHECK_CENTRAL_REF" \
            "$CHECK_BUNDLE_ENCODING" \
            "$CHECK_OIDC_SIGNATURE" \
            "$CHECK_ISSUER" \
            "$CHECK_EXPIRY" \
            "$CHECK_AUDIENCE_BINDING" \
            "$CHECK_REQUIRED_CLAIMS" \
            "$CHECK_SOURCE_FIXTURE" \
            "$CHECK_SOURCE_CLAIMS" \
            "$CHECK_DISPATCH_ACTOR"; do
            if [[ "$check" != "passed" ]]; then
              printf '%s\n' 'Environment association check failed: authorization_output' >&2
              exit 1
            fi
          done

          printf 'Environment association verified: %s\n' "$VERIFIED_ENVIRONMENT"
          printf 'Verified repository: %s\n' "$VERIFIED_REPOSITORY"
          printf 'Verified job workflow: %s\n' "$VERIFIED_JOB_WORKFLOW_REF"
          printf 'Verified ref: %s\n' "$VERIFIED_REF"
          printf 'Verified source run: %s (attempt %s)\n' "$VERIFIED_RUN_ID" "$VERIFIED_RUN_ATTEMPT"
          printf 'Audience comparison: expected=%s observed=%s result=%s\n' \
            "$VERIFIED_AUDIENCE_EXPECTED" \
            "$VERIFIED_AUDIENCE_OBSERVED" \
            "$CHECK_AUDIENCE_BINDING"
          printf 'Authorization checks passed: central_ref=%s, bundle_encoding=%s, oidc_signature=%s, issuer=%s, expiry=%s, audience_binding=%s, required_claims=%s, source_fixture=%s, source_claims=%s, dispatch_actor=%s\n' \
            "$CHECK_CENTRAL_REF" \
            "$CHECK_BUNDLE_ENCODING" \
            "$CHECK_OIDC_SIGNATURE" \
            "$CHECK_ISSUER" \
            "$CHECK_EXPIRY" \
            "$CHECK_AUDIENCE_BINDING" \
            "$CHECK_REQUIRED_CLAIMS" \
            "$CHECK_SOURCE_FIXTURE" \
            "$CHECK_SOURCE_CLAIMS" \
            "$CHECK_DISPATCH_ACTOR"
