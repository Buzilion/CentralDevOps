name: Deploy-To-VPS

on:
  workflow_call:
    inputs:
      inventory:
        description: The name of the Ansible inventory to use
        required: true
        type: string
      target_environment:
        description: GitHub Environment and inventory group to deploy to (staging or production)
        required: true
        type: string
      image_tag:
        description: Immutable 40-character commit SHA tag published by build.yml
        required: true
        type: string
      image_name:
        description: GHCR image name without the tag
        required: true
        type: string
      app_name:
        description: Docker Compose project name for this application
        required: true
        type: string
      service_name:
        description: Docker Compose service name
        required: true
        type: string
      deploy_directory:
        description: Absolute deployment directory on the VPS
        required: true
        type: string
      proxy_network:
        description: Docker network shared with the reverse proxy
        required: true
        type: string
      backend_network:
        description: Optional Docker network shared with backend services such as a database
        required: false
        type: string
        default: ""
      healthcheck_path:
        description: Optional Node.js HTTP endpoint path to require a 200 response from
        required: false
        type: string
        default: ""
      required_runtime_variables_json:
        description: JSON array of runtime environment variable names that must be non-empty
        required: false
        type: string
        default: "[]"
    secrets:
      VPS_SSH_PRIVATE_KEY:
        required: false
      APP_RUNTIME_SECRETS_JSON:
        required: false
      GHCR_TOKEN:
        required: false
      CENTRALDEVOPS_READ_TOKEN:
        required: false

jobs:
  validate-target:
    name: Validate VPS deployment target
    runs-on: ubuntu-latest
    steps:
      - name: Require a supported VPS environment
        shell: bash
        env:
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          case "$TARGET_ENVIRONMENT" in
            staging|production)
              ;;
            *)
              echo "::error::target_environment must be staging or production; development runs locally."
              exit 1
              ;;
          esac

  deploy:
    name: Deploy ${{ inputs.app_name }} to ${{ inputs.target_environment }}
    needs: validate-target
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target_environment }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out CentralDevOps Ansible configuration
        uses: actions/checkout@v4
        with:
          repository: Buzilion/CentralDevOps
          ref: main
          path: centraldevops
          token: ${{ secrets.CENTRALDEVOPS_READ_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: centraldevops/ansible/requirements.txt

      - name: Cache Ansible collections
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.ansible/collections
          key: ${{ runner.os }}-ansible-collections-py3.12-${{ hashFiles('centraldevops/ansible/requirements.txt', 'centraldevops/ansible/requirements.yml') }}

      - name: Install Ansible and collections
        working-directory: centraldevops/ansible
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          ansible-galaxy collection install -r requirements.yml

      - name: Load VPS SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Configure pinned VPS host key
        shell: bash
        env:
          VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Validate inventory target
        working-directory: centraldevops/ansible
        shell: bash
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/centraldevops/ansible/ansible.cfg
          INVENTORY: ${{ inputs.inventory }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys

          inventory_file = f"inventory/{os.environ['INVENTORY']}.yml"
          result = subprocess.run(
              ["ansible-inventory", "--inventory", inventory_file, "--list"],
              check=True,
              capture_output=True,
              text=True,
          )
          inventory = json.loads(result.stdout)

          def hosts_for_group(group_name, visited=None):
              if visited is None:
                  visited = set()
              if group_name in visited:
                  return []
              visited.add(group_name)
              group = inventory.get(group_name)
              if not isinstance(group, dict):
                  return []
              hosts = group.get("hosts", [])
              result_hosts = list(hosts) if isinstance(hosts, list) else []
              for child in group.get("children", []):
                  result_hosts.extend(hosts_for_group(child, visited))
              return result_hosts

          if not hosts_for_group(os.environ["TARGET_ENVIRONMENT"]):
              print("::error::The requested target environment has no hosts in this inventory.")
              sys.exit(1)
          PY

      - name: Check Ansible playbook syntax
        working-directory: centraldevops/ansible
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/centraldevops/ansible/ansible.cfg
          ANSIBLE_HOST_KEY_CHECKING: "True"
          INVENTORY: ${{ inputs.inventory }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          ansible-playbook \
            --syntax-check \
            --inventory "inventory/${INVENTORY}.yml" \
            --limit "$TARGET_ENVIRONMENT" \
            playbooks/deployment.yml

      - name: Validate deployment settings and prepare runtime environment
        id: prepare_runtime_config
        shell: bash
        env:
          INVENTORY: ${{ inputs.inventory }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          IMAGE_NAME: ${{ inputs.image_name }}
          APP_NAME: ${{ inputs.app_name }}
          SERVICE_NAME: ${{ inputs.service_name }}
          DEPLOY_DIRECTORY: ${{ inputs.deploy_directory }}
          PROXY_NETWORK: ${{ inputs.proxy_network }}
          BACKEND_NETWORK: ${{ inputs.backend_network }}
          HEALTHCHECK_PATH: ${{ inputs.healthcheck_path }}
          REQUIRED_RUNTIME_VARIABLES_JSON: ${{ inputs.required_runtime_variables_json }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
          REGISTRY_USERNAME: ${{ vars.GHCR_USERNAME || github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          APP_RUNTIME_VARIABLES_JSON: ${{ vars.APP_RUNTIME_VARIABLES_JSON || '{}' }}
          APP_RUNTIME_SECRETS_JSON: ${{ secrets.APP_RUNTIME_SECRETS_JSON || '{}' }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import secrets
          import sys
          from pathlib import PurePosixPath


          def fail(message):
              print(f"::error::{message}", file=sys.stderr)
              raise SystemExit(1)


          def required(name):
              value = os.environ.get(name, "")
              if not value:
                  fail(f"{name} is required.")
              return value


          def parse_environment(name):
              raw = os.environ.get(name, "{}")
              try:
                  value = json.loads(raw)
              except (json.JSONDecodeError, TypeError):
                  fail(f"{name} must contain a JSON object.")
              if not isinstance(value, dict):
                  fail(f"{name} must contain a JSON object.")
              for key, item in value.items():
                  if not isinstance(key, str) or not isinstance(item, str):
                      fail(f"{name} must contain string keys and values.")
                  if not re.fullmatch(r"[A-Za-z_][A-Za-z0-9_]*", key):
                      fail(f"{name} contains an invalid environment variable name.")
                  if "\x00" in item:
                      fail(f"{name} contains an invalid environment variable value.")
              return value


          inventory = required("INVENTORY")
          target_environment = required("TARGET_ENVIRONMENT")
          image_tag = required("IMAGE_TAG")
          image_name = required("IMAGE_NAME")
          app_name = required("APP_NAME")
          service_name = required("SERVICE_NAME")
          deploy_directory = required("DEPLOY_DIRECTORY")
          proxy_network = required("PROXY_NETWORK")
          backend_network = os.environ.get("BACKEND_NETWORK", "")
          required("VPS_SSH_PRIVATE_KEY")
          required("VPS_KNOWN_HOSTS")
          required("REGISTRY_USERNAME")
          required("REGISTRY_TOKEN")

          if not re.fullmatch(r"[A-Za-z0-9_-]+", inventory):
              fail("inventory must be a simple inventory name.")
          if not re.fullmatch(r"[A-Za-z0-9_-]+", target_environment):
              fail("target_environment must be a simple inventory group name.")
          if not re.fullmatch(r"[0-9a-f]{40}", image_tag):
              fail("image_tag must be a 40-character commit SHA.")
          image_parts = image_name.split("/")
          if (
              not re.fullmatch(r"ghcr\.io/[a-z0-9][a-z0-9._/-]*", image_name)
              or len(image_parts) < 3
              or any(part in {"", ".", ".."} for part in image_parts[1:])
          ):
              fail("image_name must be a valid GHCR image name without a tag.")
          if not re.fullmatch(r"[a-z0-9][a-z0-9_-]*", app_name):
              fail("app_name must be a valid lowercase Docker Compose project name.")
          if not re.fullmatch(r"[a-z0-9][a-z0-9_-]*", service_name):
              fail("service_name must be a valid Docker Compose service name.")
          deploy_path = PurePosixPath(deploy_directory)
          if (
              not deploy_path.is_absolute()
              or len(deploy_path.parts) < 3
              or ".." in deploy_path.parts
          ):
              fail("deploy_directory must be an absolute app-specific path without '..'.")
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_.-]*", proxy_network):
              fail("proxy_network contains invalid characters.")
          if backend_network and not re.fullmatch(
              r"[A-Za-z0-9][A-Za-z0-9_.-]*", backend_network
          ):
              fail("backend_network contains invalid characters.")
          if backend_network and backend_network == proxy_network:
              fail("backend_network must be distinct from proxy_network.")
          healthcheck_path = os.environ.get("HEALTHCHECK_PATH", "")
          if healthcheck_path and (
              not healthcheck_path.startswith("/")
              or "\n" in healthcheck_path
              or "\r" in healthcheck_path
          ):
              fail("healthcheck_path must be empty or an absolute URL path.")

          runtime_variables = parse_environment("APP_RUNTIME_VARIABLES_JSON")
          runtime_secrets = parse_environment("APP_RUNTIME_SECRETS_JSON")
          try:
              required_runtime_variables = json.loads(
                  os.environ.get("REQUIRED_RUNTIME_VARIABLES_JSON", "[]")
              )
          except (json.JSONDecodeError, TypeError):
              fail("required_runtime_variables_json must contain a JSON array.")
          if not isinstance(required_runtime_variables, list) or any(
              not isinstance(name, str)
              or not re.fullmatch(r"[A-Za-z_][A-Za-z0-9_]*", name)
              for name in required_runtime_variables
          ):
              fail("required_runtime_variables_json must contain valid environment variable names.")
          reserved_names = {"HOME", "PATH", "PWD", "SHELL", "USER"}
          reserved_prefixes = (
              "ANSIBLE_",
              "COMPOSE_",
              "DOCKER_",
              "GHCR_",
              "GITHUB_",
              "REGISTRY_",
              "RUNNER_",
          )
          for key in runtime_variables.keys() | runtime_secrets.keys():
              if key in reserved_names or key.startswith(reserved_prefixes):
                  fail("Runtime configuration contains a reserved environment variable name.")
          if runtime_variables.keys() & runtime_secrets.keys():
              fail("A runtime variable cannot be declared as both a variable and a secret.")

          runtime_environment = {**runtime_variables, **runtime_secrets}
          for name in required_runtime_variables:
              if not runtime_environment.get(name):
                  fail(f"Required runtime environment variable {name} is missing or empty.")

          for value in runtime_secrets.values():
              if value:
                  escaped = value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::add-mask::{escaped}")

          runtime_environment_file = os.path.join(
              os.environ["RUNNER_TEMP"],
              f"app-runtime-environment-{secrets.token_hex(16)}.json",
          )
          file_descriptor = os.open(
              runtime_environment_file,
              os.O_CREAT | os.O_EXCL | os.O_WRONLY,
              0o600,
          )
          with os.fdopen(file_descriptor, "w", encoding="utf-8", newline="\n") as env_file:
              env_file.write(json.dumps(runtime_environment, ensure_ascii=False, separators=(",", ":")))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8", newline="\n") as output_file:
              output_file.write(f"runtime_environment_file={runtime_environment_file}\n")
          PY

      - name: Deploy application
        working-directory: centraldevops/ansible
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/centraldevops/ansible/ansible.cfg
          ANSIBLE_HOST_KEY_CHECKING: "True"
          INVENTORY: ${{ inputs.inventory }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          APP_IMAGE: ${{ inputs.image_name }}
          APP_PROJECT_NAME: ${{ inputs.app_name }}
          APP_SERVICE_NAME: ${{ inputs.service_name }}
          APP_DEPLOY_DIRECTORY: ${{ inputs.deploy_directory }}
          APP_PROXY_NETWORK: ${{ inputs.proxy_network }}
          APP_BACKEND_NETWORK: ${{ inputs.backend_network }}
          APP_HEALTHCHECK_PATH: ${{ inputs.healthcheck_path }}
          APP_RUNTIME_ENV_FILE: ${{ steps.prepare_runtime_config.outputs.runtime_environment_file }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME || github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          trap 'rm -f "$APP_RUNTIME_ENV_FILE"' EXIT
          runtime_environment_json="$(cat "$APP_RUNTIME_ENV_FILE")"
          APP_RUNTIME_ENVIRONMENT_JSON="$runtime_environment_json" \
          ansible-playbook \
            --inventory "inventory/${INVENTORY}.yml" \
            --limit "$TARGET_ENVIRONMENT" \
            playbooks/deployment.yml
