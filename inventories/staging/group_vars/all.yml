---
bootstrap_admin_user: cdo-admin
bootstrap_deploy_user: cdo-deploy
bootstrap_admin_public_key: ""
bootstrap_managed_ssh_port: 4671
bootstrap_capacity_reference:
  physical_memory_mib: 2048
  platform_reserve_mib: 1024
  capacity_budget_mib: 1024
bootstrap_ssh_hostkey_args: >-
  -o UserKnownHostsFile={{ inventory_dir }}/known_hosts
  -o GlobalKnownHostsFile=/dev/null
  -o StrictHostKeyChecking=yes
  -o UpdateHostKeys=no
  -o IdentitiesOnly=yes
ansible_ssh_common_args: "{{ bootstrap_ssh_hostkey_args }}"
docker_engine_package_version: "5:29.9.3-1~ubuntu.24.04~noble"
docker_containerd_package_version: "2.4.2-3~ubuntu.24.04~noble"
docker_buildx_package_version: "0.38.1-1~ubuntu.24.04~noble"
docker_compose_plugin_package_version: "2.40.3-1~ubuntu.24.04~noble"
docker_db_subnet_cidr: "10.251.0.0/24"
docker_default_address_pools:
  - base: "10.250.0.0/16"
    size: 24
deploy_runtime_public_key: ""
