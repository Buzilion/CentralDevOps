---
- name: Harden SSH after a separate successful admin-key proof
  hosts: all
  gather_facts: false
  remote_user: "{{ bootstrap_admin_user }}"
  become: true
  vars:
    ansible_ssh_common_args: >-
      {{ bootstrap_ssh_hostkey_args }}
      -o PreferredAuthentications=publickey
      -o PasswordAuthentication=no
      -o KbdInteractiveAuthentication=no
  pre_tasks:
    - name: Require one exact inventory host and the temporary admin-key file
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - ansible_limit == inventory_hostname
          - >-
            lookup('ansible.builtin.env', 'ANSIBLE_PRIVATE_KEY_FILE') |
            length > 0
        fail_msg: >-
          SSH hardening requires one exact host and a temporary private-key
          file.
      no_log: true

    - name: Confirm the fresh connection is the unprivileged cdo-admin identity
      ansible.builtin.command:
        argv:
          - id
          - -un
      become: false
      register: admin_identity
      changed_when: false
      failed_when: >-
        admin_identity.rc != 0 or
        admin_identity.stdout | trim != bootstrap_admin_user
      no_log: true

  roles:
    - role: ssh_hardening
