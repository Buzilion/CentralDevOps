---
- name: Roll back failed Fail2ban activation on one managed host
  hosts: all
  gather_facts: false
  remote_user: "{{ bootstrap_admin_user }}"
  become: true
  vars:
    ansible_ssh_common_args: >-
      {{ bootstrap_ssh_hostkey_args }}
      -o PreferredAuthentications=publickey
      -o PasswordAuthentication=no
      -o KbdInteractiveAuthentication=no
  pre_tasks:
    - name: Require one exact non-disposable host and the admin key
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - ansible_limit == inventory_hostname
          - bootstrap_disposable is not defined or not bootstrap_disposable
          - >-
            lookup('ansible.builtin.env', 'ANSIBLE_PRIVATE_KEY_FILE') |
            length > 0
        fail_msg: >-
          Managed-host Fail2ban rollback requires one non-disposable host
          and the admin key.
      no_log: true

    - name: Confirm the fresh connection is cdo-admin
      ansible.builtin.command:
        argv:
          - id
          - -un
      become: false
      register: admin_identity
      changed_when: false
      failed_when: >-
        admin_identity.rc != 0 or
        admin_identity.stdout | trim != bootstrap_admin_user

  tasks:
    - name: Gather service facts before rollback
      ansible.builtin.service_facts:

    - name: Stop and disable Fail2ban when it is installed
      ansible.builtin.service:
        name: fail2ban
        enabled: false
        state: stopped
      when: ansible_facts.services.get('fail2ban.service') is not none

    - name: Remove the managed SSH jail configuration
      ansible.builtin.file:
        path: /etc/fail2ban/jail.d/centraldevops-sshd.local
        state: absent
