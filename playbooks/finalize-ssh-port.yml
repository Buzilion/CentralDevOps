---
- name: Finalize SSH on port 4671 after a fresh 4671 admin-key proof
  hosts: all
  gather_facts: false
  remote_user: "{{ bootstrap_admin_user }}"
  become: true
  vars:
    ssh_listen_ports:
      - "{{ bootstrap_managed_ssh_port }}"
    ansible_ssh_common_args: >-
      {{ bootstrap_ssh_hostkey_args }}
      -o PreferredAuthentications=publickey
      -o PasswordAuthentication=no
      -o KbdInteractiveAuthentication=no
  pre_tasks:
    - name: Require one exact host and the final SSH connection port
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - ansible_limit == inventory_hostname
          - ansible_port | int == bootstrap_managed_ssh_port
          - bootstrap_initial_ssh_port == 22
          - bootstrap_managed_ssh_port == 4671
          - >-
            lookup('ansible.builtin.env', 'ANSIBLE_PRIVATE_KEY_FILE') |
            length > 0
        fail_msg: >-
          SSH port finalization requires one exact host, port 4671, and the
          admin key.
      no_log: true

    - name: Confirm the fresh connection is cdo-admin
      ansible.builtin.command:
        argv:
          - id
          - -un
      become: false
      register: admin_identity
      changed_when: false
      failed_when: >-
        admin_identity.rc != 0 or
        admin_identity.stdout | trim != bootstrap_admin_user

  roles:
    - role: ssh_hardening

  tasks:
    - name: Remove the temporary port-22 firewall allowance
      ansible.builtin.import_role:
        name: firewall
        tasks_from: finalize-ssh
