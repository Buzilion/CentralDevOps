outbound-marketing:
  vars:
    bootstrap_postgresql_config_directory: /etc/buzilion/postgresql
    bootstrap_postgresql_state_directory: /var/lib/buzilion/postgresql
    bootstrap_postgresql_container_name: outbound-postgres
    bootstrap_postgresql_compose_project_name: buzilion-outbound-postgresql
    bootstrap_postgresql_volume_name: outbound_postgres_data
    bootstrap_postgresql_network_name: om-backend
    bootstrap_postgresql_backup_id: buzilion-outbound-postgresql-backup
    bootstrap_postgresql_backup_namespace: ""
    bootstrap_postgresql_bucket: buz-stg-prod-1-lb4jef
    bootstrap_postgresql_s3_endpoint: https://kencana.basic.box.cloudeka.id
    bootstrap_postgresql_s3_region: kencana
    bootstrap_postgresql_backup_interval: hourly
    bootstrap_postgresql_backup_max_age_seconds: 43200
  children:
    staging:
      hosts:
        buz-staging-om-1:
          ansible_host: XXX
          ansible_user: deploy
          bootstrap_user: ubuntu
          bootstrap_host_id: buz-stg-1
    production:
      hosts:
        buz-prod-om-1:
          ansible_host: 43.157.247.221
          ansible_user: deploy
          bootstrap_user: ubuntu
          bootstrap_host_id: buz-prod-1