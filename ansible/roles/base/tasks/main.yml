---
- name: Verify supported operating system
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
      - ansible_facts['distribution_version'] == '24.04'
    fail_msg: >-
      The base role supports Ubuntu 24.04 only; found
      {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}.

- name: Refresh apt metadata and install base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: "{{ base_apt_cache_valid_time }}"
