---
- name: Verify supported operating system and architecture
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
      - ansible_facts['distribution_version'] == '24.04'
      - ansible_facts['architecture'] in docker_apt_architectures
      - docker_user | string | length > 0
    fail_msg: >-
      The Docker role requires Ubuntu 24.04, a supported Docker apt architecture, and an existing
      ansible_user; found {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}
      on {{ ansible_facts['architecture'] }}.

- name: Create apt keyring directory
  ansible.builtin.file:
    path: "{{ docker_keyring_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Docker apt signing key
  ansible.builtin.get_url:
    url: "{{ docker_gpg_key_url }}"
    dest: "{{ docker_keyring_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Configure Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_apt_architectures[ansible_facts['architecture']] }}
      signed-by={{ docker_keyring_path }}] {{ docker_apt_repository_url }}
      {{ ansible_facts['distribution_release'] }} stable
    filename: docker
    state: present
    update_cache: true
    validate_certs: true

- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: false

- name: Enable and start Docker service
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started

- name: Verify Docker login user exists
  ansible.builtin.getent:
    database: passwd
    key: "{{ docker_user }}"

- name: Add Ansible login user to Docker group
  ansible.builtin.user:
    name: "{{ docker_user }}"
    groups:
      - docker
    append: true
    state: present
