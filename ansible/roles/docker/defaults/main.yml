---
docker_keyring_directory: /etc/apt/keyrings
docker_keyring_path: /etc/apt/keyrings/docker.asc
docker_gpg_key_url: https://download.docker.com/linux/ubuntu/gpg
docker_apt_repository_url: https://download.docker.com/linux/ubuntu
docker_apt_architectures:
  x86_64: amd64
  aarch64: arm64
  armv7l: armhf
  ppc64le: ppc64el
  s390x: s390x
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
docker_user: "{{ ansible_user | default('') }}"
docker_apt_cache_valid_time: 3600
