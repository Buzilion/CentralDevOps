---
- name: Verify supported operating system
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
      - ansible_facts['distribution_version'] == '24.04'
    fail_msg: >-
      The security role supports Ubuntu 24.04 only; found
      {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}.

- name: Install security baseline packages
  ansible.builtin.apt:
    name: "{{ security_packages }}"
    state: present
    update_cache: true
    cache_valid_time: "{{ security_apt_cache_valid_time }}"

- name: Enable and start security baseline services
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ security_services }}"
