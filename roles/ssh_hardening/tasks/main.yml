---
- name: Require the managed SSH port from inventory
  ansible.builtin.assert:
    that:
      - bootstrap_initial_ssh_port is defined
      - bootstrap_initial_ssh_port == 22
      - bootstrap_managed_ssh_port is defined
      - bootstrap_managed_ssh_port == 4671
      - ssh_listen_ports is defined
      - ssh_listen_ports is sequence
      - ssh_listen_ports is not string
      - >-
        (ssh_listen_ports | map('int') | list == [22, 4671]) or
        (ssh_listen_ports | map('int') | list == [4671])
    fail_msg: SSH hardening requires the reviewed SSH port 4671.

- name: Inspect SSH socket activation state
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - is-active
      - ssh.socket
  register: ssh_hardening_socket_activation
  changed_when: false
  failed_when: ssh_hardening_socket_activation.rc not in [0, 3, 4]

- name: Record whether SSH socket activation is active
  ansible.builtin.set_fact:
    ssh_hardening_socket_active: >-
      {{
        ssh_hardening_socket_activation.rc == 0 and
        (ssh_hardening_socket_activation.stdout | trim) == 'active'
      }}

- name: Inspect the SSH service kill mode before restarting socket activation
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - show
      - --property=KillMode
      - --value
      - ssh.service
  register: ssh_hardening_service_kill_mode
  changed_when: false
  when: ssh_hardening_socket_active

- name: Require SSH service restarts to preserve the active management session
  ansible.builtin.assert:
    that:
      - ssh_hardening_service_kill_mode.stdout | trim == 'process'
    fail_msg: >-
      Refusing to restart socket-activated SSH unless ssh.service uses
      KillMode=process.
  when: ssh_hardening_socket_active

- name: Inspect the existing CentralDevOps SSH policy file
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config.d/00-centraldevops-hardening.conf
  register: ssh_hardening_file

- name: Require the existing SSH policy file to be a regular file
  ansible.builtin.assert:
    that:
      - not ssh_hardening_file.stat.islnk
    fail_msg: Refusing to replace a symlinked SSH hardening file.
  when: ssh_hardening_file.stat.exists

- name: Save the prior SSH policy file when one exists
  ansible.builtin.slurp:
    src: /etc/ssh/sshd_config.d/00-centraldevops-hardening.conf
  register: ssh_hardening_previous
  when: ssh_hardening_file.stat.exists

- name: Inspect the existing systemd SSH socket policy file
  ansible.builtin.stat:
    path: /etc/systemd/system/ssh.socket.d/zzzz-centraldevops-listeners.conf
  register: ssh_hardening_socket_file

- name: Require the existing SSH socket policy file to be a regular file
  ansible.builtin.assert:
    that:
      - not ssh_hardening_socket_file.stat.islnk
    fail_msg: Refusing to replace a symlinked SSH socket policy file.
  when:
    - ssh_hardening_socket_active
    - ssh_hardening_socket_file.stat.exists

- name: Save the prior SSH socket policy file when one exists
  ansible.builtin.slurp:
    src: /etc/systemd/system/ssh.socket.d/zzzz-centraldevops-listeners.conf
  register: ssh_hardening_socket_previous
  when:
    - ssh_hardening_socket_active
    - ssh_hardening_socket_file.stat.exists

- name: Install and validate the key-only SSH policy
  block:
    - name: Install the reviewed SSH hardening drop-in
      ansible.builtin.template:
        src: centraldevops-sshd.conf.j2
        dest: /etc/ssh/sshd_config.d/00-centraldevops-hardening.conf
        owner: root
        group: root
        mode: "0644"
      register: ssh_hardening_policy_template

    - name: Create the systemd SSH socket drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/ssh.socket.d
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: ssh_hardening_socket_active

    - name: Install the reviewed SSH socket listener policy
      ansible.builtin.template:
        src: centraldevops-ssh.socket.conf.j2
        dest: /etc/systemd/system/ssh.socket.d/zzzz-centraldevops-listeners.conf
        owner: root
        group: root
        mode: "0644"
      register: ssh_hardening_socket_template
      when: ssh_hardening_socket_active

    - name: Validate the complete effective sshd configuration
      ansible.builtin.command:
        argv:
          - /usr/sbin/sshd
          - -t
      changed_when: false

    - name: Read the effective SSH authentication policy
      ansible.builtin.command:
        argv:
          - /usr/sbin/sshd
          - -T
      register: ssh_hardening_effective_config
      changed_when: false

    - name: Require key-only SSH and disabled root and password access
      ansible.builtin.assert:
        that:
          - >-
            'pubkeyauthentication yes' in
            ssh_hardening_effective_config.stdout_lines
          - >-
            'authenticationmethods publickey' in
            ssh_hardening_effective_config.stdout_lines
          - >-
            'permitrootlogin no' in
            ssh_hardening_effective_config.stdout_lines
          - >-
            'passwordauthentication no' in
            ssh_hardening_effective_config.stdout_lines
          - >-
            'kbdinteractiveauthentication no' in
            ssh_hardening_effective_config.stdout_lines
          - >-
            ssh_hardening_effective_config.stdout_lines |
            select('match', '^port ') | list | sort ==
            (
              ssh_listen_ports |
              map('int') |
              map('string') |
              map('regex_replace', '^', 'port ') |
              list |
              sort
            )
        fail_msg: >-
          Effective sshd settings do not satisfy the reviewed key-only SSH
          listener policy.

    - name: Reload systemd after installing the SSH socket policy
      ansible.builtin.systemd_service:
        name: ssh.socket
        state: started
        daemon_reload: true
      when:
        - ssh_hardening_socket_active
        - >-
          ssh_hardening_policy_template.changed or
          ssh_hardening_socket_template.changed

    - name: Restart the SSH socket and service in one systemd transaction
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - restart
          - ssh.socket
          - ssh.service
      changed_when: true
      when:
        - ssh_hardening_socket_active
        - >-
          ssh_hardening_policy_template.changed or
          ssh_hardening_socket_template.changed

    - name: Wait for SSH to return on the current access port
      ansible.builtin.wait_for_connection:
        connect_timeout: 5
        delay: 2
        sleep: 1
        timeout: 60
      when:
        - ssh_hardening_socket_active
        - >-
          ssh_hardening_policy_template.changed or
          ssh_hardening_socket_template.changed

    - name: Reload SSH after installing the policy without socket activation
      ansible.builtin.service:
        name: ssh
        state: reloaded
      when:
        - not ssh_hardening_socket_active
        - ssh_hardening_policy_template.changed

    - name: Inspect every requested SSH TCP listener
      ansible.builtin.command:
        argv:
          - /usr/bin/ss
          - -H
          - -ltn
          - "sport = :{{ item | int }}"
      loop: "{{ ssh_listen_ports }}"
      loop_control:
        label: "{{ item }}"
      register: ssh_hardening_live_listener_checks
      changed_when: false

    - name: Require every requested SSH TCP listener to be active
      ansible.builtin.assert:
        that:
          - item.stdout | trim | length > 0
        fail_msg: "Expected SSH port {{ item.item }} is not listening."
      loop: "{{ ssh_hardening_live_listener_checks.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Inspect the retired initial SSH TCP listener
      ansible.builtin.command:
        argv:
          - /usr/bin/ss
          - -H
          - -ltn
          - "sport = :{{ bootstrap_initial_ssh_port | int }}"
      register: ssh_hardening_retired_listener
      changed_when: false
      when: >-
        bootstrap_initial_ssh_port | int not in
        (ssh_listen_ports | map('int') | list)

    - name: Require the retired initial SSH port to be closed
      ansible.builtin.assert:
        that:
          - ssh_hardening_retired_listener.stdout | trim | length == 0
        fail_msg: >-
          The initial SSH port is still listening after port finalization.
      when: >-
        bootstrap_initial_ssh_port | int not in
        (ssh_listen_ports | map('int') | list)
  rescue:
    - name: Restore the prior SSH policy file when one existed
      ansible.builtin.copy:
        content: "{{ ssh_hardening_previous.content | b64decode }}"
        dest: /etc/ssh/sshd_config.d/00-centraldevops-hardening.conf
        owner: root
        group: root
        mode: "0644"
      when: ssh_hardening_file.stat.exists

    - name: Remove the candidate SSH policy when no prior file existed
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d/00-centraldevops-hardening.conf
        state: absent
      when: not ssh_hardening_file.stat.exists

    - name: Restore the prior SSH socket policy file when one existed
      ansible.builtin.copy:
        content: "{{ ssh_hardening_socket_previous.content | b64decode }}"
        dest: /etc/systemd/system/ssh.socket.d/zzzz-centraldevops-listeners.conf
        owner: root
        group: root
        mode: "0644"
      when:
        - ssh_hardening_socket_active
        - ssh_hardening_socket_file.stat.exists

    - name: Remove the candidate SSH socket policy when no prior file existed
      ansible.builtin.file:
        path: /etc/systemd/system/ssh.socket.d/zzzz-centraldevops-listeners.conf
        state: absent
      when:
        - ssh_hardening_socket_active
        - not ssh_hardening_socket_file.stat.exists

    - name: Reload systemd and ensure the prior SSH socket is active
      ansible.builtin.systemd_service:
        name: ssh.socket
        state: started
        daemon_reload: true
      when: ssh_hardening_socket_active

    - name: Restart the prior SSH socket and service together
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - restart
          - ssh.socket
          - ssh.service
      changed_when: true
      when: ssh_hardening_socket_active

    - name: Wait for SSH after restoring prior socket policy
      ansible.builtin.wait_for_connection:
        connect_timeout: 5
        delay: 2
        sleep: 1
        timeout: 60
      when: ssh_hardening_socket_active

    - name: Reload SSH after restoring prior policy without socket activation
      ansible.builtin.service:
        name: ssh
        state: reloaded
      when: not ssh_hardening_socket_active

    - name: Stop after restoring the prior SSH policies
      ansible.builtin.fail:
        msg: >-
          SSH policy application, validation, reload, or live-listener
          verification failed. The prior sshd and socket policies were
          restored; verify the active access path through the provider console
          before retrying.
