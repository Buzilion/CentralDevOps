---
- name: Require the managed SSH port from inventory
  ansible.builtin.assert:
    that:
      - bootstrap_initial_ssh_port is defined
      - bootstrap_initial_ssh_port == 22
      - bootstrap_managed_ssh_port is defined
      - bootstrap_managed_ssh_port == 4671
      - ssh_listen_ports is defined
      - ssh_listen_ports is sequence
      - ssh_listen_ports is not string
      - >-
        (ssh_listen_ports | map('int') | list == [22, 4671]) or
        (ssh_listen_ports | map('int') | list == [4671])
    fail_msg: SSH hardening requires the reviewed SSH port 4671.

- name: Inspect the existing CentralDevOps SSH policy file
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config.d/00-centraldevops-hardening.conf
  register: ssh_hardening_file

- name: Require the existing SSH policy file to be a regular file
  ansible.builtin.assert:
    that:
      - not ssh_hardening_file.stat.islnk
    fail_msg: Refusing to replace a symlinked SSH hardening file.
  when: ssh_hardening_file.stat.exists

- name: Save the prior SSH policy file when one exists
  ansible.builtin.slurp:
    src: /etc/ssh/sshd_config.d/00-centraldevops-hardening.conf
  register: ssh_hardening_previous
  when: ssh_hardening_file.stat.exists

- name: Install and validate the key-only SSH policy
  block:
    - name: Install the reviewed SSH hardening drop-in
      ansible.builtin.template:
        src: centraldevops-sshd.conf.j2
        dest: /etc/ssh/sshd_config.d/00-centraldevops-hardening.conf
        owner: root
        group: root
        mode: "0644"

    - name: Validate the complete effective sshd configuration
      ansible.builtin.command:
        argv:
          - /usr/sbin/sshd
          - -t
      changed_when: false

    - name: Read the effective SSH authentication policy
      ansible.builtin.command:
        argv:
          - /usr/sbin/sshd
          - -T
      register: ssh_hardening_effective_config
      changed_when: false

    - name: Require key-only SSH and disabled root and password access
      ansible.builtin.assert:
        that:
          - >-
            'pubkeyauthentication yes' in
            ssh_hardening_effective_config.stdout_lines
          - >-
            'authenticationmethods publickey' in
            ssh_hardening_effective_config.stdout_lines
          - >-
            'permitrootlogin no' in
            ssh_hardening_effective_config.stdout_lines
          - >-
            'passwordauthentication no' in
            ssh_hardening_effective_config.stdout_lines
          - >-
            'kbdinteractiveauthentication no' in
            ssh_hardening_effective_config.stdout_lines
          - >-
            ssh_hardening_effective_config.stdout_lines |
            select('match', '^port ') | list | sort ==
            (
              ssh_listen_ports |
              map('int') |
              map('string') |
              map('regex_replace', '^', 'port ') |
              list |
              sort
            )
        fail_msg: >-
          Effective sshd settings do not satisfy the reviewed key-only SSH
          listener policy.

    - name: >-
        Reload SSH only after the candidate configuration passes validation
      ansible.builtin.service:
        name: ssh
        state: reloaded
  rescue:
    - name: >-
        Restore the prior SSH policy file after a validation or reload failure
      ansible.builtin.copy:
        content: "{{ ssh_hardening_previous.content | b64decode }}"
        dest: /etc/ssh/sshd_config.d/00-centraldevops-hardening.conf
        owner: root
        group: root
        mode: "0644"
      when: ssh_hardening_file.stat.exists

    - name: Remove the candidate SSH policy when no prior file existed
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d/00-centraldevops-hardening.conf
        state: absent
      when: not ssh_hardening_file.stat.exists

    - name: Stop after restoring the prior SSH policy
      ansible.builtin.fail:
        msg: >-
          SSH policy application, validation, or reload failed. The prior
          drop-in was restored; verify the active SSH service through the
          provider console before retrying.
