---
- name: Refresh package metadata and apply available package upgrades
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: dist
    lock_timeout: 300
  no_log: true

- name: Install the host firewall and automatic security updates
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - ufw
    state: present
  no_log: true

- name: Enable automatic package-list refresh and security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
    owner: root
    group: root
    mode: "0644"
  no_log: true

- name: Keep unattended upgrades from rebooting the host automatically
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52cdo-no-auto-reboot
    content: |
      Unattended-Upgrade::Automatic-Reboot "false";
    owner: root
    group: root
    mode: "0644"
  no_log: true

- name: Check whether package updates require an operator-controlled reboot
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: common_reboot_required
  no_log: true

- name: Report when an operator-controlled reboot is required
  ansible.builtin.debug:
    msg: >-
      Package updates require a reboot; schedule it manually after access is
      verified.
  when: common_reboot_required.stat.exists
