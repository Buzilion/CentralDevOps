---
- name: Require an explicit boolean for optional brute-force protection
  ansible.builtin.assert:
    that:
      - fail2ban_enabled is boolean
    fail_msg: fail2ban_enabled must be an explicit boolean.

- name: Install fail2ban only after the disposable-host access-path test
  ansible.builtin.apt:
    name: fail2ban
    state: present
  when: fail2ban_enabled

- name: Configure the SSH jail only after the disposable-host access-path test
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.d/centraldevops-sshd.local
    owner: root
    group: root
    mode: "0644"
  when: fail2ban_enabled

- name: Enable fail2ban only after the disposable-host access-path test
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  when: fail2ban_enabled
